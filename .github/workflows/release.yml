name: release

# The marketplace's release pipeline (ADR-0007, ADR-0094 in hyaloslabs/hyalos).
#
# Hyalos trusts a skill release only if this workflow, run for this repository's main branch, signed
# it. That identity is pinned in Hyalos (core/plugin/src/sigstore.rs, PIPELINE):
#   subject     https://github.com/hyaloslabs/marketplace/.github/workflows/release.yml@refs/heads/main
#   issuer      https://token.actions.githubusercontent.com
#   repository  https://github.com/hyaloslabs/marketplace
#   ref         refs/heads/main
# Renaming this file, moving the repository or releasing from another branch changes the identity,
# and every install refuses the release until a Hyalos release pins the new one.
#
# Signing is keyless: there is no key to keep. The job asks GitHub for a short-lived OIDC token,
# Fulcio issues a certificate for this workflow run, and the signature is logged in Rekor. So what
# decides what gets signed is what reaches main, through main's branch rules.
# tools/check_workflows.py (ci.yml) fails if this file gains a trigger other than a push to main and
# its schedule, or if any job but `sign` can request a token. A scheduled run runs main's own file at
# refs/heads/main, so it signs as the same identity (ADR-0097).
#
# 1. build: every skill is built on two runner images, independently (S7.1), with the revocation
#    list (S7.7).  A skill whose archive is revoked fails the build.
#    snapshot: Sigstore's trusted root is fetched through TUF and verified (S7.11).
# 2. compare: the two builds must be the same bytes, or nothing is signed.
# 3. settings: the daily settings check last passed, within 8 days, with no drift open (ADR-0095).
#    sign: each archive, the snapshot and the revocation list are signed keylessly, and each bundle
#    verified for the pinned identity (S7.2, S7.11, S7.7).
# 4. publish: index.json beside the archives, the snapshot and their bundles, as a GitHub release
#    (ADR-0090), when the index or the revocation list changed, or the snapshot is due (changed, or
#    7 days old).
#    alert: if anything failed, an issue labelled release-failed says so, and nothing was published.
on:
  push:
    branches: [main]
  schedule:
    # Daily, so a new trusted root reaches a release within a day and none is older than 7 days.
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build every skill
        run: |
          python3 --version
          python3 tools/build.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  snapshot:
    name: Sigstore's trusted root, through TUF
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The TUF client, by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/tuf"
          "$RUNNER_TEMP/tuf/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r tools/requirements-snapshot.txt
      - name: Fetch it from Sigstore's TUF repository, verify it and wrap it
        run: '"$RUNNER_TEMP/tuf/bin/python" tools/snapshot.py fetch snapshot'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: the two builds agree
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-22.04
          path: b
      - name: Same files, same bytes
        run: |
          cat a/DIGESTS
          diff -r a b || { echo "the two builds differ: nothing is signed"; exit 1; }
          (cd a && sha256sum -c DIGESTS)

  settings:
    name: the protection settings were checked
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Nothing is signed unless the daily settings check (settings.yml) last finished as a pass, within
    # 8 days, and no drift issue is open (ADR-0095). A check that stopped running blocks here.
    permissions:
      actions: read
      issues: read
    steps:
      - name: The last settings check passed, recently, and nothing has drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow settings.yml --branch main \
            --status completed --limit 1 --json conclusion,createdAt --jq '.[0] // empty')
          [ -n "$last" ] || { echo "the settings check has never run: run settings.yml once"; exit 1; }
          conclusion=$(jq -r .conclusion <<<"$last"); at=$(jq -r .createdAt <<<"$last")
          [ "$conclusion" = success ] || { echo "the last settings check, at $at, was $conclusion"; exit 1; }
          age=$(( ($(date -u +%s) - $(date -u -d "$at" +%s)) / 86400 ))
          [ "$age" -le 8 ] || { echo "the last settings check was $age days ago, at $at"; exit 1; }
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label settings-drift --state open --json number --jq 'length')
          [ "$open" = 0 ] || { echo "a settings-drift issue is open"; exit 1; }
          echo "checked at $at, $age day(s) ago"

  sign:
    name: sign keylessly
    needs: [compare, settings, snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can ask for a signing token.
    permissions:
      id-token: write
    env:
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-24.04
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign each archive and the snapshot
        run: |
          cd dist
          for archive in *.skill trusted-root.json revocations.json; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - name: Each bundle verifies for the pinned identity, and for no other
        run: |
          cd dist
          for archive in *.skill trusted-root.json revocations.json; do
            cosign verify-blob --bundle "$archive.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
              --certificate-github-workflow-repository "${{ github.repository }}" \
              --certificate-github-workflow-ref refs/heads/main "$archive"
            if cosign verify-blob --bundle "$archive.sigstore.json" \
                --certificate-identity "${IDENTITY/release.yml/ci.yml}" \
                --certificate-oidc-issuer "$ISSUER" "$archive" 2>/dev/null; then
              echo "$archive verified for another workflow's identity"; exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the index
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Write the index against the release before it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern index.json --dir previous 2>err; then
            python3 tools/index.py dist --previous previous/index.json
            gh release download --repo "$GITHUB_REPOSITORY" --pattern trusted-root.json --dir previous \
              || echo "the last release has no trusted-root snapshot"
            gh release download --repo "$GITHUB_REPOSITORY" --pattern revocations.json --dir previous \
              || echo "the last release has no revocation list"
            at=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
            echo "SNAPSHOT_PUBLISHED_AT=$at" >> "$GITHUB_ENV"
          elif grep -qi 'release not found' err; then
            python3 tools/index.py dist
          else
            cat err; exit 1
          fi
      - name: Publish only when the index or the revocation list changed, or the snapshot is due
        run: |
          same_index=no
          if [ -f previous/index.json ] && cmp -s <(jq -S . previous/index.json) <(jq -S . dist/index.json); then
            same_index=yes
          fi
          set +e
          python3 tools/revocations.py due dist/revocations.json previous/revocations.json
          changed=$?
          set -e
          case "$changed" in
            0) same_index=no ;;
            1) ;;
            *) exit 1 ;;
          esac
          set +e
          python3 tools/snapshot.py due dist/trusted-root.json previous/trusted-root.json
          due=$?
          set -e
          case "$due" in
            0) ;;
            1) if [ "$same_index" = yes ]; then
                 echo "nothing changed since the last release"; echo "SKIP=1" >> "$GITHUB_ENV"
               fi ;;
            *) exit 1 ;;
          esac
      - name: Publish
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "$tag" \
            --notes "Skills and Sigstore's trusted root, built and signed from ${GITHUB_SHA}." \
            dist/index.json dist/*.skill dist/*.skill.sigstore.json \
            dist/trusted-root.json dist/trusted-root.json.sigstore.json \
            dist/revocations.json dist/revocations.json.sigstore.json

  alert:
    name: say that the release failed
    needs: [build, snapshot, compare, settings, sign, publish]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A failed fetch, verification or signature publishes nothing (S7.11); this says so in an issue,
    # one at a time, so a scheduled run that fails is not missed.
    permissions:
      issues: write
    steps:
      - name: Open or add to the release-failed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create release-failed --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The release pipeline failed and published nothing" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-failed --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "It failed again ($GITHUB_EVENT_NAME): $run"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failed \
              --title "The release pipeline failed and published nothing" \
              --body "Run ($GITHUB_EVENT_NAME): $run. The last release stays current. Close this once a run passes."
          fi
